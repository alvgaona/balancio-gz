[workspace]
name = "balancio-gz"
version = "0.1.0"
description = "A self-balancing robot for Gazebo"
authors = ["Alvaro <alvgaona@gmail.com>"]
channels = ["robostack-jazzy", "conda-forge"]
platforms = ["linux-64", "osx-arm64"]
preview = ["pixi-build"]

[dependencies]
ros-jazzy-balancio-description = { path = "src/balancio_description" }
ros-jazzy-balancio-control = { path = "src/balancio_control" }
ros-jazzy-balancio-bringup = { path = "src/balancio_bringup" }
ros-jazzy-balancio-nmpc = { path = "src/balancio_nmpc" }
acados = { git = "https://github.com/alvgaona/acados-recipe", branch = "main" }
ros-jazzy-ros2launch = "*"
ros-jazzy-ros2run = "*"
ros-jazzy-rviz2 = "*"
ros-jazzy-teleop-twist-keyboard = "*"
pytest = ">=8,<9"
# Same compilers (and libc++) as the pixi package builds. The system clang
# links the system libc++, which crashes when mixed with conda's CasADi.
c-compiler = "*"
cxx-compiler = "*"

[tasks]
test = "pytest src/balancio_control/test src/balancio_description/test -q"
test-cpp = { cmd = "cmake -S src/balancio_nmpc -B build/balancio_nmpc -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH=$CONDA_PREFIX -Wno-dev && cmake --build build/balancio_nmpc -j && ctest --test-dir build/balancio_nmpc --output-on-failure" }
sim = "ros2 launch balancio_bringup balancio.launch.py"
gui = "gz sim -g"

[feature.style.dependencies]
ruff = "*"
lefthook = "*"
commitlint = "*"

[feature.style.tasks]
lint = "ruff check src tools && ruff format --check src tools"
format = "ruff check --fix src tools && ruff format src tools"
hooks = "lefthook install"

[environments]
default = ["style"]
style = { features = ["style"], no-default-feature = true }
